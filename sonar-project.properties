# CI-based SonarQube Cloud analysis (requires SONAR_TOKEN and CI mode).
# SonarQube Automatic Analysis cannot import coverage.xml.
sonar.projectKey=Aragova_telegram-membership-saas
sonar.organization=aragova
sonar.host.url=https://sonarcloud.io

# The Cloud analysis-scope UI defines the initial scope. The deprecated
# sonar.sources and sonar.tests settings are ignored by the active scanner.
# Preserve existing exclusions and coverage import; verify scope after upload.
sonar.exclusions=tests/**/*
sonar.python.version=3.12,3.13

# Generated by GitHub Actions pytest-cov in the same checkout.
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
