# Opt-in capacity profile for up to 100 simultaneously active customer bots.
# IMPORTANT: use only with compose.yaml on a VM sized and verified for >=240
# PostgreSQL connections, sufficient RAM/CPU, and an approved maintenance window.
# This file never affects the existing single-supervisor staging deployment
# unless the operator explicitly passes -f compose.scale100.yaml.
services:
  postgres:
    command:
      - postgres
      - -c
      - max_connections=${TMS_POSTGRES_MAX_CONNECTIONS:-240}

  customer-supervisor:
    environment:
      TMS_CUSTOMER_SUPERVISOR_SHARD_COUNT: "4"
      TMS_CUSTOMER_SUPERVISOR_SHARD_ID: "0"
      TMS_CUSTOMER_SUPERVISOR_MAX_BOTS: "32"

  customer-supervisor-1:
    extends:
      file: compose.yaml
      service: customer-supervisor
    profiles: ["supervisor-scale"]
    environment:
      TMS_CUSTOMER_SUPERVISOR_SHARD_COUNT: "4"
      TMS_CUSTOMER_SUPERVISOR_SHARD_ID: "1"
      TMS_CUSTOMER_SUPERVISOR_MAX_BOTS: "32"

  customer-supervisor-2:
    extends:
      file: compose.yaml
      service: customer-supervisor
    profiles: ["supervisor-scale"]
    environment:
      TMS_CUSTOMER_SUPERVISOR_SHARD_COUNT: "4"
      TMS_CUSTOMER_SUPERVISOR_SHARD_ID: "2"
      TMS_CUSTOMER_SUPERVISOR_MAX_BOTS: "32"

  customer-supervisor-3:
    extends:
      file: compose.yaml
      service: customer-supervisor
    profiles: ["supervisor-scale"]
    environment:
      TMS_CUSTOMER_SUPERVISOR_SHARD_COUNT: "4"
      TMS_CUSTOMER_SUPERVISOR_SHARD_ID: "3"
      TMS_CUSTOMER_SUPERVISOR_MAX_BOTS: "32"
