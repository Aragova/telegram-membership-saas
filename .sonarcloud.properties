# SonarQube Cloud Automatic Analysis.
# CI and the deployed Docker image run Python 3.12; pyproject.toml
# declares compatibility with Python 3.12 and 3.13.
sonar.python.version=3.12,3.13

# Keep the entire repo in source scope: Python, database migrations,
# Docker, GitHub Actions, backup scripts, root manifests and configuration.
# Only the tests/ tree is reclassified as test code, not dropped entirely.
sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**/*
