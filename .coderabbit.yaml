# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ru-RU

reviews:
  profile: assertive
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "src/telegram_membership_saas/**/*.py"
      instructions: |
        Проводите строгое техническое ревью Python 3.12+ / aiogram 3 / asyncio.
        Проверяйте алгоритмическую сложность по времени и памяти (Big O).
        Выявляйте лишние вложенные циклы, повторные проходы и запросы N+1.
        При наличии лучшего варианта предложите конкретный рефакторинг:
        подходящую структуру данных (dict/set/deque/heap и т. п.),
        оценку сложности до/после и возможные компромиссы.
        Находите блокирующие вызовы в async-коде: time.sleep,
        синхронные HTTP/SQL/файловые операции, тяжёлые CPU-вычисления.
        Проверяйте обработку Telegram API exceptions, flood limits,
        таймаутов, повторов webhook/update, невалидных пользовательских
        данных, гонок и идемпотентность финансовых операций.
        Проверяйте изоляцию tenant/project, права доступа, утечки
        токенов и логирование персональных данных.
        Проверяйте обработчики callback и клавиатуры: уникальность
        callback_data, авторизацию при нажатии, устаревшие кнопки,
        корректную работу «Назад», отмены и отсутствие тупиков.
        Проверяйте состояние мастера owner_setup_sessions:
        bot_scope_id, step, prompt_message_id, generation, TTL,
        допустимость переходов и изоляцию между ботами.
        Не предполагайте использование aiogram FSMContext: в проекте
        есть собственное персистентное состояние мастера в PostgreSQL.
        Предлагайте точечные исправления с конкретным кодом/путём,
        а не общие пожелания. Отделяйте подтверждённые дефекты
        от гипотетических рисков; не изменяйте бизнес-правила без запроса.
    - path: ".github/workflows/**"
      instructions: |
        Проверяйте минимальные permissions, безопасность событий
        pull_request, отсутствие pull_request_target с исполнением
        непроверенного кода, защиту от записи в чужие ветки,
        работу на fork PR и идемпотентность комментариев.
    - path: "migrations/**/*.py"
      instructions: |
        Проверяйте обратную совместимость миграций, ограничения
        PostgreSQL/RLS, блокировки, откат и сохранность платёжной истории.
