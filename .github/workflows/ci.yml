name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TMS_DATABASE_URL: postgresql+asyncpg://membership_runtime:membership_runtime@localhost:5432/app
      TMS_MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # Real deployment starts each entrypoint in a fresh interpreter.
      # compileall and pytest's preloaded import graph cannot detect cycles.
      - name: Cold-start import smoke tests
        run: |
          python -c "import telegram_membership_saas.customer_supervisor_main"
          python -c "import telegram_membership_saas.customer_bot_main"
          python -c "import telegram_membership_saas.bot_main"

      - name: Alembic heads
        run: alembic heads

      - name: Apply migrations as database owner
        run: alembic upgrade head

      - name: Create non-bypass runtime role
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main() -> None:
              connection = await asyncpg.connect(
                  user="postgres",
                  password="postgres",
                  database="app",
                  host="localhost",
              )
              try:
                  await connection.execute(
                      "CREATE ROLE membership_runtime LOGIN PASSWORD 'membership_runtime'"
                  )
                  await connection.execute("GRANT CONNECT ON DATABASE app TO membership_runtime")
                  await connection.execute("GRANT USAGE ON SCHEMA public TO membership_runtime")
                  await connection.execute(
                      "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public "
                      "TO membership_runtime"
                  )
                  await connection.execute(
                      "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public "
                      "TO membership_runtime"
                  )
                  await connection.execute(
                      "GRANT EXECUTE ON FUNCTION "
                      "public.complete_bot_ownership_transfer(uuid,uuid) "
                      "TO membership_runtime"
                  )
                  await connection.execute(
                      "GRANT EXECUTE ON FUNCTION public.list_customer_bot_targets() "
                      "TO membership_runtime"
                  )
                  await connection.execute(
                      "GRANT EXECUTE ON FUNCTION public.list_customer_bot_removals() "
                      "TO membership_runtime"
                  )
                  await connection.execute(
                      "GRANT EXECUTE ON FUNCTION "
                      "public.platform_report_snapshot(timestamptz, integer, integer) "
                      "TO membership_runtime"
                  )
                  await connection.execute(
                      "GRANT EXECUTE ON FUNCTION public.platform_monitor_health_snapshot() "
                      "TO membership_runtime"
                  )
                  await connection.execute(
                      "GRANT EXECUTE ON FUNCTION public.platform_monitor_is_operator() "
                      "TO membership_runtime"
                  )
                  await connection.execute(
                      "GRANT EXECUTE ON FUNCTION "
                      "public.platform_usage_snapshot(timestamptz, integer, integer) "
                      "TO membership_runtime"
                  )
                  await connection.execute(
                      "GRANT EXECUTE ON FUNCTION "
                      "public.platform_merchant_finances(timestamptz, integer, integer) "
                      "TO membership_runtime"
                  )
                  await connection.execute(
                      "GRANT EXECUTE ON FUNCTION "
                      "public.platform_merchant_risk_snapshot(timestamptz, integer, integer) "
                      "TO membership_runtime"
                  )
                  await connection.execute(
                      "GRANT EXECUTE ON FUNCTION "
                      "public.platform_saas_hold_invoice_report(integer,integer) "
                      "TO membership_runtime"
                  )

                  # CI creates membership_runtime AFTER applying migrations.
                  # Grant only the narrow SECURITY DEFINER RPC entry points.
                  for function in (
                      "platform_saas_payment_details_read()",
                      "platform_saas_payment_details_set(text)",
                      "platform_saas_owner_invoice_report(integer,integer)",
                      "platform_saas_notice_schedule()",
                      "platform_saas_notice_claim()",
                      "platform_saas_notice_finish(uuid,integer,boolean)",
                      "platform_saas_publish_fx_rate(date,text,numeric)",
                      "platform_saas_monthly_fx(date)",
                      "platform_saas_project_preview(uuid,date)",
                      "platform_saas_quote_project_bill(uuid,date,text)",
                      "platform_saas_publish_cbr_fx_rate(date,text,numeric,date)",
                      "platform_saas_publish_cbr_daily_fx(date,text,numeric,date)",
                      "platform_saas_daily_fx(date)",
                      "platform_saas_select_invoice_currency(uuid,text)",
                      "platform_saas_invoice_currency_snapshot(uuid)",
                      "platform_saas_confirm_currency_receipt(uuid,text,numeric,text)",
                      "platform_saas_record_refund_credit(uuid,text,numeric,text)",
                      "platform_saas_refund_credit_report(uuid)",
                      "platform_saas_preview_invoice_currency(uuid,text)",
                      "platform_saas_invoice_credit_history(uuid)",
                      "platform_saas_lock_invoice_currency_expected(uuid,text,date,numeric,numeric)",
                      "platform_saas_owner_foreign_invoice_count()",
                      "platform_saas_publish_star_reward_rate(date,numeric,text)",
                      "platform_saas_capture_new_file_stars(integer)",
                      "platform_saas_star_project_summary(uuid,date)",
                      "platform_saas_capture_star_refunds(integer)",
                      "platform_saas_star_project_refund_summary(uuid,date)",
                      "platform_saas_capture_new_subscription_stars(integer)",
                      "platform_saas_capture_subscription_star_refunds(integer)",
                      "platform_saas_capture_crypto_sales(integer)",
                      "platform_saas_crypto_project_summary(uuid,date)",
                      "platform_saas_crypto_refund_candidate(uuid,text)",
                      "platform_saas_record_crypto_transfer_credit(uuid,bigint,text,bigint,text,numeric,timestamptz)",
                      "platform_saas_crypto_refund_summary(uuid,date)",
                      "platform_saas_unified_monthly_preview(uuid,date,uuid)",
                      "platform_saas_v2_bank_method(text,text)",
                      "platform_saas_v2_invoice_balance(uuid)",
                      "platform_saas_v2_available_methods(uuid)",
                      "platform_saas_v2_create_attempt(uuid,numeric,text)",
                      "platform_saas_v2_submit_proof(uuid,bigint,bigint,text,text)",
                      "platform_saas_v2_approve_attempt(uuid,text)",
                      "platform_saas_v2_reject_attempt(uuid,text)",
                      "platform_saas_v2_pending_proofs(integer)",
                      "subscription_owner_end_times(uuid,uuid)",
                  ):
                      await connection.execute(
                          f"GRANT EXECUTE ON FUNCTION public.{function} "
                          "TO membership_runtime"
                      )
                  await connection.execute(
                      "REVOKE ALL ON public.platform_saas_payment_details, "
                      "public.platform_saas_notice_outbox, "
                      "public.platform_saas_currency_settlements, "
                      "public.platform_saas_currency_receipts, "
                      "public.platform_saas_refund_credits, "
                      "public.platform_saas_star_reward_rates, "
                      "public.platform_saas_star_capture_control, "
                      "public.platform_saas_star_sales, "
                      "public.platform_saas_star_refund_credits, "
                      "public.platform_saas_star_subscription_credits, "
                      "public.platform_saas_crypto_capture_control, "
                      "public.platform_saas_crypto_scan_cursor, "
                      "public.platform_saas_crypto_sales, "
                      "public.platform_saas_crypto_transfer_credits, "
                      "public.platform_saas_payment_methods_v2, "
                      "public.platform_saas_payment_attempts_v2, "
                      "public.platform_saas_payment_proofs_v2, "
                      "public.platform_saas_payment_allocations_v2, "
                      "public.platform_saas_payment_rejections_v2 "
                      "FROM membership_runtime"
                  )
                  # The original provider rate is append-only. Only the
                  # trusted per-project settlement service may read/insert.
                  await connection.execute(
                      "REVOKE UPDATE,DELETE ON "
                      "public.crypto_pay_paid_usd_rates FROM membership_runtime"
                  )

                  # Match production: migration 0029 explicitly denies
                  # runtime CRUD on platform-only commercial tables.
                  await connection.execute(
                      "REVOKE ALL ON platform_owner_bot_limits, "
                      "merchant_platform_trial_claims, "
                      "merchant_commission_reservations, "
                      "merchant_risk_observations FROM membership_runtime"
                  )
              finally:
                  await connection.close()

          asyncio.run(main())
          PY

      - name: Test
        run: pytest

      - name: Compile imports
        run: python -m compileall -q src

      - name: Validate compose
        run: docker compose config

      - name: Validate opt-in 100-bot compose overlay
        run: docker compose -f compose.yaml -f compose.scale100.yaml --profile supervisor --profile supervisor-scale config -q

      - name: Validate opt-in light 100-bot compose overlay
        run: docker compose -f compose.yaml -f compose.light100.yaml --profile supervisor config -q

      - name: Build container
        run: docker build -t telegram-membership-saas:ci .
