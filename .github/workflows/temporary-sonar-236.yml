name: Temporary Sonar PR 236 diagnostic
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/temporary-sonar-236.yml'
permissions:
  checks: read
jobs:
  read-annotation:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number == 236
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read previous Sonar check annotation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET 'repos/Aragova/telegram-membership-saas/check-runs/138393018770/annotations' --jq '.[] | {path, start_line, end_line, annotation_level, title, message}'
