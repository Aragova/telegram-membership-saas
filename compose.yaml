services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: membership
      POSTGRES_USER: membership
      # Required, URL-safe secrets supplied by the host's gitignored .env.
      # Editing these variables alone does NOT rotate existing database roles.
      POSTGRES_PASSWORD: ${VIMI_PG_OWNER_PASSWORD:?Set VIMI_PG_OWNER_PASSWORD in private .env}
      VIMI_PG_RUNTIME_PASSWORD: ${VIMI_PG_RUNTIME_PASSWORD:?Set VIMI_PG_RUNTIME_PASSWORD in private .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U membership -d membership"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-runtime.sql:/docker-entrypoint-initdb.d/10-runtime.sql:ro
      - ./docker/postgres/20-runtime-password.sh:/docker-entrypoint-initdb.d/20-runtime-password.sh:ro

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TMS_ENVIRONMENT: development
      TMS_DATABASE_URL: postgresql+asyncpg://membership_runtime:${VIMI_PG_RUNTIME_PASSWORD:?Set private runtime password}@postgres:5432/membership
      TMS_MIGRATION_DATABASE_URL: postgresql+asyncpg://membership:${VIMI_PG_OWNER_PASSWORD:?Set private owner password}@postgres:5432/membership
      TMS_DEFAULT_PROJECT_TIMEZONE: Europe/Moscow
    ports:
      - "8000:8000"

  bot:
    profiles: ["telegram"]
    build: .
    command: ["tms-bot"]
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TMS_ENVIRONMENT: development
      TMS_DATABASE_URL: postgresql+asyncpg://membership_runtime:${VIMI_PG_RUNTIME_PASSWORD:?Set private runtime password}@postgres:5432/membership
      TMS_MIGRATION_DATABASE_URL: postgresql+asyncpg://membership:${VIMI_PG_OWNER_PASSWORD:?Set private owner password}@postgres:5432/membership
      TMS_DEFAULT_PROJECT_TIMEZONE: Europe/Moscow
      TMS_RICH_MESSAGES_ENABLED: ${TMS_RICH_MESSAGES_ENABLED:-true}
      TMS_PLATFORM_OWNER_TELEGRAM_ID: ${TMS_PLATFORM_OWNER_TELEGRAM_ID:-}
      # CENTRAL platform SaaS payment credentials. Never forward these to
      # customer-supervisor or customer-bot (tenant-owned sales).
      # Compose reads the gitignored host .env for interpolation; it does
      # not automatically inject arbitrary host variables into containers.
      TMS_SAAS_LAVA_TOP_API_KEY: ${TMS_SAAS_LAVA_TOP_API_KEY:-}
      TMS_SAAS_LAVA_TOP_OFFER_ID: ${TMS_SAAS_LAVA_TOP_OFFER_ID:-}
      TMS_SAAS_SHORTLINKS_ENABLED: ${TMS_SAAS_SHORTLINKS_ENABLED:-false}
      TMS_SAAS_CRYPTO_PAY_API_TOKEN: ${TMS_SAAS_CRYPTO_PAY_API_TOKEN:-}
      TMS_SAAS_CRYPTO_PAY_TESTNET: ${TMS_SAAS_CRYPTO_PAY_TESTNET:-false}
      TMS_PLATFORM_TIMEZONE: ${TMS_PLATFORM_TIMEZONE:-Europe/Moscow}
      TMS_PLATFORM_BACKUP_GCS_BUCKET: ${TMS_PLATFORM_BACKUP_GCS_BUCKET:-}
      TMS_TELEGRAM_BOT_TOKEN: ${TMS_TELEGRAM_BOT_TOKEN:-}
      TMS_BOT_TOKEN_ENCRYPTION_KEY: ${TMS_BOT_TOKEN_ENCRYPTION_KEY:-}
      TMS_TELEGRAM_PROJECT_ID: ${TMS_TELEGRAM_PROJECT_ID:-}
      TMS_TELEGRAM_CENTRAL_ACCESS_ENABLED: ${TMS_TELEGRAM_CENTRAL_ACCESS_ENABLED:-true}
      TMS_TELEGRAM_WORKER_POLL_SECONDS: ${TMS_TELEGRAM_WORKER_POLL_SECONDS:-1}

  customer-supervisor:
    profiles: ["supervisor"]
    build: .
    command: ["tms-customer-supervisor"]
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TMS_ENVIRONMENT: development
      TMS_DATABASE_URL: postgresql+asyncpg://membership_runtime:${VIMI_PG_RUNTIME_PASSWORD:?Set private runtime password}@postgres:5432/membership
      TMS_DEFAULT_PROJECT_TIMEZONE: Europe/Moscow
      # Same configured owner identity as the central bot. Required for
      # owner-only monthly CBR publication in the customer supervisor.
      TMS_PLATFORM_OWNER_TELEGRAM_ID: ${TMS_PLATFORM_OWNER_TELEGRAM_ID:-}
      TMS_RICH_MESSAGES_ENABLED: ${TMS_RICH_MESSAGES_ENABLED:-true}
      TMS_BOT_TOKEN_ENCRYPTION_KEY: ${TMS_BOT_TOKEN_ENCRYPTION_KEY:-}
      TMS_TELEGRAM_CENTRAL_ACCESS_ENABLED: "false"
      TMS_TELEGRAM_WORKER_POLL_SECONDS: ${TMS_TELEGRAM_WORKER_POLL_SECONDS:-1}
      TMS_CUSTOMER_SUPERVISOR_MAX_BOTS: ${TMS_CUSTOMER_SUPERVISOR_MAX_BOTS:-10}
      TMS_RICH_FILE_CHECKOUT_BOT_IDS: ${TMS_RICH_FILE_CHECKOUT_BOT_IDS:-}
      TMS_RICH_SUBSCRIPTION_CHECKOUT_BOT_IDS: ${TMS_RICH_SUBSCRIPTION_CHECKOUT_BOT_IDS:-}
      # Off by default outside the opt-in light100 release overlay.
      TMS_CRYPTO_PAY_BUYER_ENABLED: ${TMS_CRYPTO_PAY_BUYER_ENABLED:-false}

  customer-bot:
    profiles: ["customer"]
    build: .
    command: ["tms-customer-bot"]
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TMS_ENVIRONMENT: development
      TMS_DATABASE_URL: postgresql+asyncpg://membership_runtime:${VIMI_PG_RUNTIME_PASSWORD:?Set private runtime password}@postgres:5432/membership
      TMS_DEFAULT_PROJECT_TIMEZONE: Europe/Moscow
      TMS_RICH_MESSAGES_ENABLED: ${TMS_RICH_MESSAGES_ENABLED:-true}
      TMS_BOT_TOKEN_ENCRYPTION_KEY: ${TMS_BOT_TOKEN_ENCRYPTION_KEY:-}
      TMS_TELEGRAM_PROJECT_ID: ${TMS_TELEGRAM_PROJECT_ID:-}
      TMS_CUSTOMER_TELEGRAM_BOT_ID: ${TMS_CUSTOMER_TELEGRAM_BOT_ID:-}
      TMS_RICH_FILE_CHECKOUT_BOT_IDS: ${TMS_RICH_FILE_CHECKOUT_BOT_IDS:-}
      TMS_RICH_SUBSCRIPTION_CHECKOUT_BOT_IDS: ${TMS_RICH_SUBSCRIPTION_CHECKOUT_BOT_IDS:-}
      TMS_CRYPTO_PAY_BUYER_ENABLED: ${TMS_CRYPTO_PAY_BUYER_ENABLED:-false}
      TMS_TELEGRAM_WORKER_POLL_SECONDS: ${TMS_TELEGRAM_WORKER_POLL_SECONDS:-1}

volumes:
  postgres_data:
