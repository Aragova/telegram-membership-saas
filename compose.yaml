services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: membership
      POSTGRES_USER: membership
      POSTGRES_PASSWORD: membership
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U membership -d membership"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-runtime.sql:/docker-entrypoint-initdb.d/10-runtime.sql:ro

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TMS_ENVIRONMENT: development
      TMS_DATABASE_URL: postgresql+asyncpg://membership_runtime:membership_runtime@postgres:5432/membership
      TMS_MIGRATION_DATABASE_URL: postgresql+asyncpg://membership:membership@postgres:5432/membership
      TMS_DEFAULT_PROJECT_TIMEZONE: Europe/Moscow
    ports:
      - "8000:8000"

  bot:
    profiles: ["telegram"]
    build: .
    command: ["tms-bot"]
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TMS_ENVIRONMENT: development
      TMS_DATABASE_URL: postgresql+asyncpg://membership_runtime:membership_runtime@postgres:5432/membership
      TMS_MIGRATION_DATABASE_URL: postgresql+asyncpg://membership:membership@postgres:5432/membership
      TMS_DEFAULT_PROJECT_TIMEZONE: Europe/Moscow
      TMS_PLATFORM_OWNER_TELEGRAM_ID: ${TMS_PLATFORM_OWNER_TELEGRAM_ID:-}
      TMS_PLATFORM_TIMEZONE: ${TMS_PLATFORM_TIMEZONE:-Europe/Moscow}
      TMS_TELEGRAM_BOT_TOKEN: ${TMS_TELEGRAM_BOT_TOKEN:-}
      TMS_BOT_TOKEN_ENCRYPTION_KEY: ${TMS_BOT_TOKEN_ENCRYPTION_KEY:-}
      TMS_TELEGRAM_PROJECT_ID: ${TMS_TELEGRAM_PROJECT_ID:-}
      TMS_TELEGRAM_CENTRAL_ACCESS_ENABLED: ${TMS_TELEGRAM_CENTRAL_ACCESS_ENABLED:-true}
      TMS_TELEGRAM_WORKER_POLL_SECONDS: ${TMS_TELEGRAM_WORKER_POLL_SECONDS:-1}

  customer-supervisor:
    profiles: ["supervisor"]
    build: .
    command: ["tms-customer-supervisor"]
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TMS_ENVIRONMENT: development
      TMS_DATABASE_URL: postgresql+asyncpg://membership_runtime:membership_runtime@postgres:5432/membership
      TMS_DEFAULT_PROJECT_TIMEZONE: Europe/Moscow
      TMS_BOT_TOKEN_ENCRYPTION_KEY: ${TMS_BOT_TOKEN_ENCRYPTION_KEY:-}
      TMS_TELEGRAM_CENTRAL_ACCESS_ENABLED: "false"
      TMS_TELEGRAM_WORKER_POLL_SECONDS: ${TMS_TELEGRAM_WORKER_POLL_SECONDS:-1}
      TMS_CUSTOMER_SUPERVISOR_MAX_BOTS: ${TMS_CUSTOMER_SUPERVISOR_MAX_BOTS:-10}
      TMS_RICH_FILE_CHECKOUT_BOT_IDS: ${TMS_RICH_FILE_CHECKOUT_BOT_IDS:-}
      TMS_RICH_SUBSCRIPTION_CHECKOUT_BOT_IDS: ${TMS_RICH_SUBSCRIPTION_CHECKOUT_BOT_IDS:-}

  customer-bot:
    profiles: ["customer"]
    build: .
    command: ["tms-customer-bot"]
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TMS_ENVIRONMENT: development
      TMS_DATABASE_URL: postgresql+asyncpg://membership_runtime:membership_runtime@postgres:5432/membership
      TMS_DEFAULT_PROJECT_TIMEZONE: Europe/Moscow
      TMS_BOT_TOKEN_ENCRYPTION_KEY: ${TMS_BOT_TOKEN_ENCRYPTION_KEY:-}
      TMS_TELEGRAM_PROJECT_ID: ${TMS_TELEGRAM_PROJECT_ID:-}
      TMS_CUSTOMER_TELEGRAM_BOT_ID: ${TMS_CUSTOMER_TELEGRAM_BOT_ID:-}
      TMS_RICH_FILE_CHECKOUT_BOT_IDS: ${TMS_RICH_FILE_CHECKOUT_BOT_IDS:-}
      TMS_RICH_SUBSCRIPTION_CHECKOUT_BOT_IDS: ${TMS_RICH_SUBSCRIPTION_CHECKOUT_BOT_IDS:-}
      TMS_TELEGRAM_WORKER_POLL_SECONDS: ${TMS_TELEGRAM_WORKER_POLL_SECONDS:-1}

volumes:
  postgres_data:
